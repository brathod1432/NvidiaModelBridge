services:
  nvidia-model-bridge:
    build: .
    container_name: nvidia-model-bridge
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=https://integrate.api.nvidia.com/v1
      - NVIDIA_MODEL_BRIDGE_HOST=0.0.0.0
      - NVIDIA_MODEL_BRIDGE_PORT=8000
      - NVIDIA_SERVICE_TIMEOUT_SECONDS=90
      # Security
      - NVIDIA_BRIDGE_API_KEY=${NVIDIA_BRIDGE_API_KEY:-}
      - NVIDIA_BRIDGE_AUTH_ENABLED=${NVIDIA_BRIDGE_AUTH_ENABLED:-false}
      - NVIDIA_BRIDGE_CORS_ORIGINS=${NVIDIA_BRIDGE_CORS_ORIGINS:-*}
      - NVIDIA_BRIDGE_RATE_LIMIT=${NVIDIA_BRIDGE_RATE_LIMIT:-60}
      - NVIDIA_BRIDGE_RATE_WINDOW=${NVIDIA_BRIDGE_RATE_WINDOW:-60}
      # Infrastructure
      - NVIDIA_BRIDGE_ENABLE_CACHE=${NVIDIA_BRIDGE_ENABLE_CACHE:-true}
      - NVIDIA_BRIDGE_CACHE_TTL=${NVIDIA_BRIDGE_CACHE_TTL:-300}
      - NVIDIA_BRIDGE_ENABLE_METRICS=${NVIDIA_BRIDGE_ENABLE_METRICS:-true}
      - NVIDIA_BRIDGE_ENABLE_STREAMING=${NVIDIA_BRIDGE_ENABLE_STREAMING:-true}
      - NVIDIA_BRIDGE_LOG_LEVEL=${NVIDIA_BRIDGE_LOG_LEVEL:-INFO}
      - NVIDIA_BRIDGE_LOG_JSON=${NVIDIA_BRIDGE_LOG_JSON:-false}
    volumes:
      - ./audits:/app/audits
      - ./docs:/app/docs
      - bridge-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bridge-data:
